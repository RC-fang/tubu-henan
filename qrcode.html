<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>禾力乡村·徒步河南 工作台</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f0f2f5;padding:20px}
.card{background:#fff;border-radius:16px;padding:30px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1);max-width:400px;width:100%}
h1{font-size:20px;color:#1a73e8;margin-bottom:8px}
.url{font-size:13px;color:#666;margin-bottom:20px;word-break:break-all}
#qrcode{display:flex;justify-content:center;margin:20px 0}
.tip{font-size:13px;color:#999;margin-top:16px}
</style>
</head>
<body>
<div class="card">
<h1>禾力乡村·徒步河南 工作台</h1>
<div class="url">https://rc-fang.github.io/tubu-henan/?v=10</div>
<div id="qrcode"></div>
<div class="tip">微信扫码打开<br>领导查看 / 现场操作</div>
</div>
<script>
new QRCode(document.getElementById("qrcode"), {
  text: "https://rc-fang.github.io/tubu-henan/?v=10",
  width: 256,
  height: 256,
  colorDark: "#1a73e8",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.H
});
</script>
</body>
</html>
